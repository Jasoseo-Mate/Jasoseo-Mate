{% extends 'base.html' %}

{% block title %}학력 목록 - 자소서 메이트{% endblock %}

{% block content %}
<main class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">학력 목록</h1>
        <a class="text-blue-600 font-bold" href="{% url 'accounts:education_add' %}">학력 추가</a>
    </div>
    <div class="space-y-3">
        {% for item in object_list %}
        <div class="bg-white border rounded-xl p-4 flex justify-between gap-4">
            <span><b>{{ item.school_name }}</b> · {{ item.major }} · {{ item.degree }}</span>
            <span class="shrink-0">
                <a class="text-blue-600 mr-3" href="{% url 'accounts:education_edit' item.pk %}">수정</a>
                <a class="text-red-600" href="{% url 'accounts:education_delete' item.pk %}">삭제</a>
            </span>
        </div>
        {% empty %}
        <p class="text-slate-500">등록된 학력이 없습니다.</p>
        {% endfor %}
    </div>
</main>
{% endblock %}
